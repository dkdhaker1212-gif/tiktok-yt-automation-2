# THE channel config. Loaded and validated by src/config.py.
# One entry per channel. This repo hosts exactly one.

channels:
  - id: channel_2                         # unique; used in DB, logs, secret names
    tiktok_username: "bigfootvlogs"       # AI Bigfoot cryptid vlogs
    youtube_channel_name: "PawsOfNature"  # https://www.youtube.com/@PawsOfNature-u6z
    owner_email: "mrjohn112311@gmail.com" # channel id UC0_CNgntFW4r0kDhyKyQvkA (main
                                          #   channel, not a brand account)

    google_credentials_file: "credentials/channel_2_client_secret.json"
    oauth_token_file: "tokens/channel_2_token.json"

    videos_per_day: 2                     # 2 Shorts/day added to an existing long-form channel
    description_footer: ""
    default_tags: [bigfoot, sasquatch, cryptid, bigfoot sighting, bigfoot caught on camera,
                   bigfoot vlog, cryptid vlog, ai bigfoot, found footage, forest, folklore,
                   yeti, monster caught on camera]
    youtube_category_id: "24"             # Entertainment
    enabled: true
    max_retry_days: 7
    shorts_max_seconds: 180
    upload_mode: popular_only             # always pick the most-viewed unposted video
    max_download_candidates: 20

    use_ai_seo: true
    edit:
      enabled: true
      zoom_crop_pct: 2.0
      speed: 1.03
      hflip: false
      fade_seconds: 0.25
      sharpen: true
      denoise: false
      saturation: 1.06
      contrast: 1.04
      loudnorm: true
      volume_gain_db: 0.0
      blur_regions: []
      brand_overlay:                     # small corner mark (channel already branded)
        enabled: true
        image: "assets/brand_badge.png"
        corner: tr                       # top-right, out of the way
        width_pct: 11                    # deliberately small
        margin_pct: 3
        opacity: 0.92

    thumbnail:
      enabled: true
      hook_source: title
      position: bottom
      accent_rgb: [255, 176, 59]
      hook_templates:
        - "WAIT FOR IT"
        - "SO CUTE"
        - "HE DID WHAT?!"
        - "YOU'LL SMILE"

    slot_publish_times_utc:               # these ARE the cron fire times
      1: "16:00"                          # 12:00 PM US Eastern (US midday scroll) = 9:30 PM IST
      2: "23:00"                          # 7:00 PM US Eastern (US evening prime)  = 4:30 AM IST
